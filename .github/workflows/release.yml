name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (for example v1.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: video-tool
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            binary_name: video-tool.exe
            asset_name: video-tool-windows-x64.exe
            cargo_flags: ""
          - os: ubuntu-latest
            label: linux-x64
            binary_name: video-tool
            asset_name: video-tool-linux-x64.AppImage
            cargo_flags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libfuse2 \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Download Windows embedded tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/download_tools.ps1

      - name: Download Linux bundled FFmpeg tools
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p tools
          archive="ffmpeg-linux.tar.xz"
          downloaded=false
          for url in \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
            "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
          do
            echo "Downloading static FFmpeg from ${url}"
            if curl --fail --show-error --location \
              --connect-timeout 20 --max-time 600 \
              --retry 5 --retry-delay 5 --retry-all-errors \
              "${url}" -o "${archive}"; then
              downloaded=true
              break
            fi
          done
          if [[ "${downloaded}" != "true" ]]; then
            echo "Unable to download a static FFmpeg archive from all mirrors" >&2
            exit 1
          fi
          mkdir -p ffmpeg-linux
          tar -xf ffmpeg-linux.tar.xz -C ffmpeg-linux --strip-components=1
          ffmpeg_path="$(find ffmpeg-linux -type f -name ffmpeg -print -quit)"
          ffprobe_path="$(find ffmpeg-linux -type f -name ffprobe -print -quit)"
          test -n "${ffmpeg_path}" && test -n "${ffprobe_path}"
          cp "${ffmpeg_path}" tools/ffmpeg
          cp "${ffprobe_path}" tools/ffprobe
          chmod +x tools/ffmpeg tools/ffprobe
          tools/ffmpeg -version | head -n 1
          tools/ffprobe -version | head -n 1

      - name: Run tests
        run: cargo test --locked ${{ matrix.cargo_flags }}

      - name: Build release binary
        run: cargo build --locked --release ${{ matrix.cargo_flags }}

      - name: Prepare Windows EXE asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item -LiteralPath "target\release\${{ matrix.binary_name }}" -Destination "${{ matrix.asset_name }}" -Force

      - name: Prepare Linux AppImage asset
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          APPDIR="VideoTool.AppDir"
          mkdir -p "$APPDIR/usr/bin/tools" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/scalable/apps"
          cp "target/release/${{ matrix.binary_name }}" "$APPDIR/usr/bin/video-tool"
          cp tools/ffmpeg tools/ffprobe "$APPDIR/usr/bin/tools/"
          chmod +x "$APPDIR/usr/bin/video-tool" "$APPDIR/usr/bin/tools/ffmpeg" "$APPDIR/usr/bin/tools/ffprobe"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/video-tool" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/video-tool.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Video Tool
          Exec=video-tool
          Icon=video-tool
          Categories=AudioVideo;Video;
          EOF
          cp "$APPDIR/video-tool.desktop" "$APPDIR/usr/share/applications/video-tool.desktop"
          cat > "$APPDIR/video-tool.svg" <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <rect width="256" height="256" rx="40" fill="#131618"/>
            <path d="M58 76h140v104H58z" fill="#1f2324" stroke="#f28944" stroke-width="8"/>
            <path d="M104 100l56 28-56 28z" fill="#50cdb9"/>
          </svg>
          EOF
          cp "$APPDIR/video-tool.svg" "$APPDIR/usr/share/icons/hicolor/scalable/apps/video-tool.svg"
          curl -L "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -o appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool "$APPDIR" "${{ matrix.asset_name }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.asset_name }}

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          case "${RELEASE_TAG}" in
            v*) ;;
            *)
              echo "Release tag must start with v (received: ${RELEASE_TAG})" >&2
              exit 1
              ;;
          esac

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Remove legacy CI releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("ci-")) | .tagName' \
            | while IFS= read -r tag; do
                [ -z "$tag" ] || gh release delete "$tag" --yes --cleanup-tag
              done

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Video Tool ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          prerelease: false
          files: |
            artifacts/windows-x64/video-tool-windows-x64.exe
            artifacts/linux-x64/video-tool-linux-x64.AppImage
